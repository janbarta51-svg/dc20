media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories: [image]

content:
  - name: gangs
    label: Gangy
    type: file
    path: content/gangcyklopedie.json
    format: json
    fields:
      - name: gangs
        label: Seznam gangů
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Název gangu
            type: string
            required: true
            description: Název, který se zobrazí v Gangcyklopedii.

          - name: logo
            label: Znak gangu
            type: image
            description: Nahraj znak (PNG, JPG, WebP nebo SVG). Na webu bude vedle názvu gangu přes téměř celou výšku řádku, vždy celý a bez ořezu. Pokud ho nevybereš, nebude se zobrazovat žádný obrázek.
            options:
              categories: [image]
              extensions: [png, jpg, jpeg, webp, svg]
              rename: safe

          - name: description
            label: Popis
            type: rich-text
            required: true
            description: Piš normálně jako ve Wordu. Enter vytvoří odstavec; odrážky můžeš udělat tlačítkem v editoru nebo řádky začínajícími pomlčkou.
            options:
              format: markdown
              switcher: true
              media: false

  - name: characters
    label: Postavy
    type: file
    path: content/postavy.json
    format: json
    fields:
      - name: groups
        label: Gangy a jejich postavy
        type: object
        description: Přidej gang (složku), a uvnitř něj libovolný počet postav. Gangy spravuješ nezávisle na Gangcyklopedii.
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Název gangu / složky
            type: string
            required: true
            description: Například Řezníci, Dragny Pogrom nebo Vargnótt.

          - name: logo
            label: Znak gangu
            type: image
            description: Nahraj znak gangu pro sekci Postavy. Zobrazí se v plné výšce řádku vedle názvu, bez oříznutí. Bez obrázku se nezobrazí žádný symbol. Znak může být jiný než v Gangcyklopedii.
            options:
              categories: [image]
              extensions: [png, jpg, jpeg, webp, svg]
              rename: safe

          - name: characters
            label: Postavy v tomto gangu
            type: object
            description: Zde přidávej, upravuj a maž postavy patřící k tomuto gangu.
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Jméno postavy
                type: string
                required: true
                description: Zobrazí se jako název rozklikávací karty postavy.

              - name: description
                label: Popis
                type: rich-text
                required: true
                description: Popis postavy. Editor podporuje odstavce, nadpisy i odrážky.
                options:
                  format: markdown
                  switcher: true
                  media: false

              - name: image
                label: Obrázek
                type: image
                description: Volitelné. Bez obrázku se zobrazí jen jméno a popis.
                options:
                  categories: [image]
                  extensions: [png, jpg, jpeg, webp, svg]
                  rename: safe

  - name: chronicle
    label: Kronika
    type: file
    path: content/kronika.json
    format: json
    fields:
      - name: sessions
        label: Sessiony
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {day}"
        fields:
          - name: title
            label: Název
            type: string
            required: true
            description: Název session / kapitoly kroniky.

          - name: day
            label: Den
            type: string
            required: true
            description: Např. Den 1, Session 4 nebo 8. 9. 2026.

          - name: description
            label: Popis co se stalo
            type: rich-text
            required: true
            description: Hlavní zápis session. Editor podporuje odstavce, nadpisy i odrážky.
            options:
              format: markdown
              switcher: true
              media: false

  - name: fragments
    label: Střípky z Kostelce
    type: file
    path: content/stripky.json
    format: json
    fields:
      - name: chapters
        label: Kapitoly
        type: object
        description: Samostatné příběhové střípky z Kostelce, nezávislé na Kronice.
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Kapitola
            type: string
            required: true
            description: Nadpis rozklikávací kapitoly.

          - name: description
            label: Text kapitoly
            type: rich-text
            required: true
            description: Piš jako v Kronice. Můžeš použít odstavce, nadpisy, tučné písmo, odrážky a pododrážky.
            options:
              format: markdown
              switcher: true
              media: false

  - name: bestiary
    label: Bestiář
    type: file
    path: content/bestiar.json
    format: json
    fields:
      - name: creatures
        label: Potvory
        type: object
        description: Přidávej nové potvory a jejich popisy. Každá se zobrazí jako rozklikávací položka.
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Jméno potvory
            type: string
            required: true
            description: Název potvory zobrazený na webu.

          - name: description
            label: Popis potvory
            type: rich-text
            required: true
            description: Stejný editor jako Střípky. Můžeš psát odstavce, nadpisy, seznamy a pododrážky.
            options:
              format: markdown
              switcher: true
              media: false

          - name: image
            label: Fotka potvory
            type: image
            description: Volitelný obrázek. Pokud jej nenahraješ, zobrazí se pouze jméno a popis.
            options:
              categories: [image]
              extensions: [png, jpg, jpeg, webp, svg]
              rename: safe
