name: Site audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)
          node --check sw.js

      - name: Validate JSON and CMS data shapes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in [
              Path('manifest.webmanifest'),
              Path('content/gangcyklopedie.json'),
              Path('content/postavy.json'),
              Path('content/kronika.json'),
          ]:
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              print(f'JSON OK: {path}')

          checks = [
              ('content/gangcyklopedie.json', 'gangs', 'title'),
              ('content/postavy.json', 'characters', 'name'),
              ('content/kronika.json', 'sessions', 'title'),
          ]
          for filename, list_key, required_key in checks:
              data = json.loads(Path(filename).read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'{filename}: root must be an object')
              items = data.get(list_key)
              if not isinstance(items, list):
                  raise SystemExit(f'{filename}: {list_key} must be a list')
              for i, item in enumerate(items):
                  if not isinstance(item, dict):
                      raise SystemExit(f'{filename}: item {i} must be an object')
                  if not str(item.get(required_key, '')).strip():
                      raise SystemExit(f'{filename}: item {i} is missing {required_key}')
              print(f'CMS shape OK: {filename}')
          PY

      - name: Validate Pages CMS YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.pages.yml'); puts 'Pages CMS YAML OK'"

      - name: Check local HTML asset references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ('src','href'):
                      value=attrs.get(key)
                      if value:
                          self.refs.append((tag,key,value))

          parser=Parser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          missing=[]
          for tag,key,value in parser.refs:
              if value.startswith(('#','http://','https://','mailto:','data:')):
                  continue
              clean=urlsplit(value).path.lstrip('/')
              if not clean:
                  continue
              if not Path(clean).exists():
                  missing.append((tag,key,value))
          if missing:
              for ref in missing:
                  print('Missing HTML asset:', ref)
              raise SystemExit(1)
          print('HTML asset references OK')
          PY

      - name: Check Service Worker precache files
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text=Path('sw.js').read_text(encoding='utf-8')
          block=re.search(r'const ASSETS=\[(.*?)\];', text, re.S)
          if not block:
              raise SystemExit('sw.js: ASSETS list not found')
          paths=re.findall(r"['\"](\./[^'\"]*)['\"]", block.group(1))
          missing=[]
          for entry in paths:
              clean=entry[2:]
              if not clean:
                  continue
              if not Path(clean).exists():
                  missing.append(entry)
          if missing:
              print('Missing precache files:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'Service Worker precache OK: {len(paths)} entries')
          PY

      - name: Check class PDF files
        run: |
          set -euo pipefail
          for file in \
            assets/references/DC20_Cleric_Class_Reference.pdf \
            assets/references/DC20_Champion_Class_Reference.pdf \
            assets/references/DC20_Sorcerer_Class_Reference.pdf \
            assets/references/DC20_Spellblade_Class_Reference.pdf; do
            test -s "$file"
            head -c 5 "$file" | grep -q '%PDF-'
            echo "PDF OK: $file"
          done

      - name: Basic CSS structure check
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for filename in ['assets/css/styles.css','assets/css/lore-fixes.css']:
              text=Path(filename).read_text(encoding='utf-8')
              text=re.sub(r'/\*.*?\*/','',text,flags=re.S)
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'{filename}: unbalanced braces')
              print(f'CSS braces OK: {filename}')
          PY

      - name: Install browser for runtime smoke test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Smoke-test every route in Chromium
        run: |
          python3 -m http.server 4173 >/tmp/dc20-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
            });

            const routes = [
              'home','character','combo','combat','cleric','champion','sorcerer',
              'spellblade','toolkit','gangcyklopedie','postavy','kronika'
            ];

            await page.goto('http://127.0.0.1:4173/#home', {waitUntil:'networkidle'});

            const navState = await page.evaluate(() => ({
              commander: Boolean(document.querySelector('a[data-route="commander"]')),
              champion: Boolean(document.querySelector('a[data-route="champion"]')),
              sorcerer: Boolean(document.querySelector('a[data-route="sorcerer"]'))
            }));
            if (navState.commander || !navState.champion || !navState.sorcerer) {
              throw new Error(`Class navigation mismatch: ${JSON.stringify(navState)}`);
            }

            const homeDownloads = await page.locator('.pdf-download-copy strong').allTextContents();
            if (homeDownloads.includes('Commander') || !homeDownloads.includes('Champion') || !homeDownloads.includes('Sorcerer')) {
              throw new Error(`Home PDF downloads mismatch: ${homeDownloads.join(', ')}`);
            }

            for (const route of routes) {
              await page.evaluate(r => { location.hash = `#${r}`; }, route);
              await page.waitForTimeout(250);
              const state = await page.evaluate(() => ({
                hash: location.hash,
                hasApp: Boolean(document.querySelector('#app')),
                text: document.querySelector('#app')?.textContent?.trim() || ''
              }));
              if (!state.hasApp || !state.text) {
                throw new Error(`Route #${route} rendered an empty app`);
              }
              console.log(`Route OK: #${route}`);
            }

            await page.evaluate(() => { location.hash = '#champion'; });
            await page.waitForTimeout(250);
            if (!(await page.locator('h1', {hasText:'Champion'}).count())) throw new Error('Champion page missing');
            if (!(await page.locator('[data-selector="champion"]').count())) throw new Error('Champion Maneuver selector missing');

            await page.evaluate(() => { location.hash = '#sorcerer'; });
            await page.waitForTimeout(250);
            if (!(await page.locator('h1', {hasText:'Sorcerer'}).count())) throw new Error('Sorcerer page missing');
            if (!(await page.locator('#sorcererSourcePicker').count())) throw new Error('Sorcerer source picker missing');

            for (const route of ['gangcyklopedie','postavy','kronika']) {
              await page.evaluate(r => { location.hash = `#${r}`; }, route);
              await page.waitForTimeout(300);
              const toggle = page.locator('.lore-toggle').first();
              if (await toggle.count()) {
                await toggle.click();
                const expanded = await toggle.getAttribute('aria-expanded');
                if (expanded !== 'true') throw new Error(`#${route}: accordion did not open`);
                await toggle.click();
                const collapsed = await toggle.getAttribute('aria-expanded');
                if (collapsed !== 'false') throw new Error(`#${route}: accordion did not close`);
              }
              console.log(`Accordion OK: #${route}`);
            }

            await page.locator('#themeToggle').click();
            await page.locator('#langToggle').click();
            await page.waitForTimeout(100);

            if (errors.length) {
              throw new Error(`Browser errors:\n${errors.join('\n')}`);
            }

            await browser.close();
            console.log('Runtime smoke test OK');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
