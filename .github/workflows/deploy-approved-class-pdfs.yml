name: Deploy Bard and Summoner PDFs

on:
  push:
    branches: [main]
    paths:
      - 'tools/pdf-patches/deploy-bard-summoner.trigger'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct approved PDFs
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd

          cat tools/pdf-patches/bard-deploy.part00               tools/pdf-patches/bard-deploy.part01               tools/pdf-patches/bard-deploy.part02               tools/pdf-patches/bard-deploy.part03               tools/pdf-patches/bard-deploy.part04               tools/pdf-patches/bard-deploy.part05               tools/pdf-patches/bard-deploy.part06             | base64 -d > /tmp/bard.zst

          cat tools/pdf-patches/summoner-deploy.part00               tools/pdf-patches/summoner-deploy.part01               tools/pdf-patches/summoner-deploy.part02               tools/pdf-patches/summoner-deploy.part03               tools/pdf-patches/summoner-deploy.part04               tools/pdf-patches/summoner-deploy.part05               tools/pdf-patches/summoner-deploy.part06               tools/pdf-patches/summoner-deploy.part07               tools/pdf-patches/summoner-deploy.part08               tools/pdf-patches/summoner-deploy.part09               tools/pdf-patches/summoner-deploy.part10               tools/pdf-patches/summoner-deploy.part11               tools/pdf-patches/summoner-deploy.part12               tools/pdf-patches/summoner-deploy.part13               tools/pdf-patches/summoner-deploy.part14               tools/pdf-patches/summoner-deploy.part15               tools/pdf-patches/summoner-deploy.part16               tools/pdf-patches/summoner-deploy.part17               tools/pdf-patches/summoner-deploy.part18               tools/pdf-patches/summoner-deploy.part19               tools/pdf-patches/summoner-deploy.part20               tools/pdf-patches/summoner-deploy.part21             | base64 -d > /tmp/summoner.zst

          zstd -d --patch-from=assets/references/DC20_Cleric_Class_Reference.pdf             /tmp/bard.zst             -o assets/references/DC20_Bard_Class_Reference.pdf -f

          zstd -d --patch-from=assets/references/DC20_Cleric_Class_Reference.pdf             /tmp/summoner.zst             -o assets/references/DC20_Summoner_Class_Reference.pdf -f

      - name: Verify exact approved PDFs
        shell: bash
        run: |
          set -euo pipefail
          echo '96d950942bfc1088ab97edd584d7e274b39d93b9db0ec44b9033f0e72030869f  assets/references/DC20_Bard_Class_Reference.pdf' | sha256sum -c -
          echo 'c30ebc4858d2ed07d419c360a1582fdf99d2cffe4f96e367f3fe8c6cab0ac47b  assets/references/DC20_Summoner_Class_Reference.pdf' | sha256sum -c -
          test "$(stat -c%s assets/references/DC20_Bard_Class_Reference.pdf)" = '852318'
          test "$(stat -c%s assets/references/DC20_Summoner_Class_Reference.pdf)" = '528307'

      - name: Replace old class PDFs
        shell: bash
        run: |
          set -euo pipefail
          rm -f             assets/references/DC20_Sorcerer_Class_Reference.pdf             assets/references/DC20_Spellblade_Class_Reference.pdf             assets/references/Spellblade_Turn_Cheat_Sheet.pdf

      - name: Commit Bard and Summoner PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/references
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Deploy Bard and Summoner class references'
          git push
