name: Deploy Bard and Summoner PDFs

on:
  push:
    branches: [main]
    paths:
      - 'tools/pdf-patches/deploy-bard-summoner.trigger'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct approved Bard and Summoner PDFs
        shell: bash
        run: |
          set -euo pipefail
          cat tools/pdf-patches/bard-new.part00               tools/pdf-patches/bard-new.part01               tools/pdf-patches/bard-new.part02               tools/pdf-patches/bard-new.part03               tools/pdf-patches/bard-new.part04             | base64 -d | zstd -d -o assets/references/DC20_Bard_Class_Reference.pdf -f

          cat tools/pdf-patches/summoner-new.part00               tools/pdf-patches/summoner-new.part01               tools/pdf-patches/summoner-new.part02             | base64 -d | zstd -d -o assets/references/DC20_Summoner_Class_Reference.pdf -f

      - name: Verify exact approved PDFs
        shell: bash
        run: |
          set -euo pipefail
          echo '96d950942bfc1088ab97edd584d7e274b39d93b9db0ec44b9033f0e72030869f  assets/references/DC20_Bard_Class_Reference.pdf' | sha256sum -c -
          echo 'c30ebc4858d2ed07d419c360a1582fdf99d2cffe4f96e367f3fe8c6cab0ac47b  assets/references/DC20_Summoner_Class_Reference.pdf' | sha256sum -c -
          test "$(stat -c%s assets/references/DC20_Bard_Class_Reference.pdf)" = '852318'
          test "$(stat -c%s assets/references/DC20_Summoner_Class_Reference.pdf)" = '528307'

      - name: Remove obsolete class PDFs
        shell: bash
        run: |
          rm -f             assets/references/DC20_Sorcerer_Class_Reference.pdf             assets/references/DC20_Spellblade_Class_Reference.pdf             assets/references/Spellblade_Turn_Cheat_Sheet.pdf

      - name: Refresh offline cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const CACHE='[^']+';", "const CACHE='gangsterka-dc20-bard-summoner-v2';", s, count=1)
          if n != 1:
              raise SystemExit('Could not update cache name')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate live class setup
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-route="bard"' index.html
          grep -q 'data-route="summoner"' index.html
          ! grep -q 'data-route="sorcerer"' index.html
          ! grep -q 'data-route="spellblade"' index.html
          grep -q 'Gangy z Kostelce' index.html
          grep -q "R.classes.bard" assets/js/classes-current.js
          grep -q "R.classes.summoner" assets/js/classes-current.js
          grep -q "DC20_Bard_Class_Reference.pdf" assets/js/app.js
          grep -q "DC20_Summoner_Class_Reference.pdf" assets/js/app.js
          ! grep -q "\['Sorcerer','assets/references/DC20_Sorcerer_Class_Reference.pdf'\]" assets/js/app.js
          ! grep -q "\['Spellblade','assets/references/DC20_Spellblade_Class_Reference.pdf'\]" assets/js/app.js
          node --check assets/js/classes-current.js
          node --check assets/js/app.js
          node --check sw.js

      - name: Commit final Bard and Summoner version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             assets/references/DC20_Bard_Class_Reference.pdf             assets/references/DC20_Summoner_Class_Reference.pdf             assets/references/DC20_Sorcerer_Class_Reference.pdf             assets/references/DC20_Spellblade_Class_Reference.pdf             assets/references/Spellblade_Turn_Cheat_Sheet.pdf             sw.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Deploy approved Bard and Summoner references'
            git push
          fi
