name: Apply class update

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_class_update.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Champion and Sorcerer site changes
        run: python3 tools/apply_class_update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/app.js assets/css/styles.css sw.js .github/workflows/site-audit.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Champion and Sorcerer pages and remove Commander navigation"
            git push
          fi
