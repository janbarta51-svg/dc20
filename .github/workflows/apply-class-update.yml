name: Apply class update

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_class_update.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Champion and Sorcerer site changes
        run: python3 tools/apply_class_update.py

      - name: Install PDF dependency
        run: python3 -m pip install reportlab

      - name: Build class reference PDFs
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/build_class_pdfs.py
          python3 /tmp/build_class_pdfs.py
          test -s assets/references/DC20_Champion_Class_Reference.pdf
          test -s assets/references/DC20_Sorcerer_Class_Reference.pdf
          file assets/references/DC20_Champion_Class_Reference.pdf
          file assets/references/DC20_Sorcerer_Class_Reference.pdf

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/app.js assets/css/styles.css sw.js assets/references/DC20_Champion_Class_Reference.pdf assets/references/DC20_Sorcerer_Class_Reference.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Champion and Sorcerer pages and remove Commander navigation"
            git push
          fi
