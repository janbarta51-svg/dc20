name: Apply class update

on:
  push:
    branches: [main]
    paths:
      - 'tools/class-update.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected Champion and Sorcerer pages
        run: python3 tools/apply_class_update.py

      - name: Install PDF dependency
        run: python3 -m pip install reportlab

      - name: Build corrected class reference PDFs
        run: python3 tools/build_class_pdfs.py

      - name: Validate site changes
        shell: bash
        run: |
          grep -q "R.classes.champion" assets/js/classes-extra.js
          grep -q "R.classes.sorcerer" assets/js/classes-extra.js
          grep -q "Wild Magic Table" assets/js/classes-extra.js
          grep -q "DC20_Champion_Class_Reference.pdf" assets/js/app.js
          grep -q "DC20_Sorcerer_Class_Reference.pdf" assets/js/app.js
          if grep -q "DC20_Commander_Class_Reference.pdf" assets/js/app.js; then
            echo "Commander PDF is still exposed in the app" >&2
            exit 1
          fi
          test -s assets/references/DC20_Champion_Class_Reference.pdf
          test -s assets/references/DC20_Sorcerer_Class_Reference.pdf

      - name: Commit corrected live version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/classes-extra.js assets/js/app.js assets/css/styles.css sw.js \
            assets/references/DC20_Champion_Class_Reference.pdf \
            assets/references/DC20_Sorcerer_Class_Reference.pdf
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Deploy corrected Champion and Sorcerer version"
            git push
          fi
